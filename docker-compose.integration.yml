services:
  mysql:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: maatify_eligibility_test
      MYSQL_USER: eligibility_test
      MYSQL_PASSWORD: eligibility_test
      MYSQL_ROOT_PASSWORD: root_test_only
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -proot_test_only --silent"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
