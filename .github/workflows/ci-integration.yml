name: ci-integration

on:
  pull_request:
    branches: [main, draft/rc-2]
  push:
    branches: [main, draft/rc-2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  integration:
    name: Real MySQL Integration (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql
          coverage: none
      - name: Resolve current compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Unit suite
        run: composer test:unit
      - name: Golden suite
        run: composer test:golden
      - name: Integration suite
        run: composer test:integration
      - name: Integration suite repeatability run
        run: composer test:integration
      - name: Consumer Verification Harness
        run: composer test:harness
      - name: Runnable example smoke
        run: composer test:examples

  integration-gate:
    name: Integration aggregate gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [integration]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Verify upstream integration jobs
        run: tools/assert-gate.sh "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
