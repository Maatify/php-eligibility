name: ci-tests

on:
  pull_request:
    branches: [main, phase/v1.0.0-rc.1]
  push:
    branches: [main, phase/v1.0.0-rc.1]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

env:
  COMPOSER_NO_INTERACTION: '1'

jobs:
  unit-golden:
    name: Unit + Golden (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Resolve current compatible dependencies
        run: composer update --no-interaction --prefer-dist --no-progress
      - name: Unit suite
        run: composer test:unit
      - name: Golden suite
        run: composer test:golden

  lowest-deps:
    name: Lowest dependencies (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Resolve lowest supported dependencies
        run: composer update --prefer-lowest --prefer-stable --no-interaction --prefer-dist --no-progress
      - name: Unit suite
        run: composer test:unit
      - name: Golden suite
        run: composer test:golden
      - name: PHPStan level max with lowest dependencies
        run: composer analyse

  tests-gate:
    name: Tests aggregate gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-golden, lowest-deps]
    if: always()
    steps:
      - name: Verify upstream test jobs
        run: tools/assert-gate.sh "$RESULTS"
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}